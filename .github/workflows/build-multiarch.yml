name: Build multi-arch boltzgen image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout boltzgen source
        uses: actions/checkout@v4
        with:
          repository: HannesStark/boltzgen

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: rensdg-code
          password: ${{ secrets.PACKAGES_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push AMD64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/rensdg-code/boltzgen:latest-amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  build-arm64:
    # Native ARM64 runner — much faster than QEMU for the heavy NGC base image.
    # On private repos this costs ~2x standard runner rate (~$0.008/min).
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout this repo (for Dockerfile.arm64)
        uses: actions/checkout@v4

      - name: Checkout boltzgen source
        uses: actions/checkout@v4
        with:
          repository: HannesStark/boltzgen
          path: boltzgen-src

      - name: Copy ARM64 Dockerfile into build context
        run: cp Dockerfile.arm64 boltzgen-src/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: rensdg-code
          password: ${{ secrets.PACKAGES_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64
        uses: docker/build-push-action@v6
        with:
          context: boltzgen-src
          file: boltzgen-src/Dockerfile.arm64
          platforms: linux/arm64
          push: true
          tags: ghcr.io/rensdg-code/boltzgen:latest-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  merge:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: rensdg-code
          password: ${{ secrets.PACKAGES_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/rensdg-code/boltzgen:latest \
            ghcr.io/rensdg-code/boltzgen:latest-amd64 \
            ghcr.io/rensdg-code/boltzgen:latest-arm64
